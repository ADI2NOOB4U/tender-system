services:
  - type: web
    name: tender-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    workingDir: backend
    envVars:
      - key: REDIS_URL
        value: YOUR_UPSTASH_URL
      - key: OPENAI_API_KEY
        value: YOUR_OPENAI_KEY
    - type: worker
    name: tender-worker
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "celery -A app.worker.celery_app worker --loglevel=info --pool=solo"
    workingDir: backend
    envVars:
      - key: REDIS_URL
        value: YOUR_UPSTASH_URL
      - key: OPENAI_API_KEY
        value: YOUR_OPENAI_KEY
  envVars:
  - key: PYTHON_VERSION
    value: 3.11.9